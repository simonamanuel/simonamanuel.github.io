<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Final congestion-control experiment results</title>
  <desc id="desc">Aggregate goodput for six TCP and queue-discipline combinations, with CUBIC plus FqCoDel producing the highest result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101c"/>
      <stop offset="1" stop-color="#10243b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#267dc4"/>
      <stop offset="1" stop-color="#69b7ff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#ba5d1d"/>
      <stop offset="1" stop-color="#ff9b4c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <g opacity=".15" stroke="#69b7ff" fill="none">
    <path d="M0 112h315l58 58h208"/><path d="M0 184h240l76 76h265"/>
    <path d="M1600 88h-220l-66 66h-170"/><path d="M1600 625h-330l-52-52h-130"/>
    <circle cx="376" cy="170" r="5" fill="#69b7ff"/><circle cx="1314" cy="154" r="5" fill="#69b7ff"/>
  </g>
  <g transform="translate(760 88)">
    <text x="0" y="0" fill="#dcecff" font-family="Arial, sans-serif" font-size="24" font-weight="700">FINAL 64-SENDER INCAST STUDY</text>
    <text x="0" y="36" fill="#8ca8c2" font-family="Arial, sans-serif" font-size="16">Aggregate goodput (Gbps) · 10 Gbps bottleneck</text>
    <g transform="translate(0 72)">
      <path d="M0 440H760" stroke="#54708a" stroke-width="2"/>
      <path d="M0 330H760M0 220H760M0 110H760" stroke="#54708a" stroke-width="1" opacity=".25"/>
      <g fill="#7893ac" font-family="Arial, sans-serif" font-size="14">
        <text x="-28" y="445">0</text><text x="-28" y="335">2</text><text x="-28" y="225">4</text><text x="-28" y="115">6</text><text x="-28" y="8">8</text>
      </g>
      <g>
        <rect x="44" y="145" width="72" height="295" rx="7" fill="url(#cyan)" opacity=".78"/>
        <rect x="161" y="141" width="72" height="299" rx="7" fill="url(#cyan)" opacity=".86"/>
        <rect x="278" y="41" width="72" height="399" rx="7" fill="url(#cyan)" filter="url(#glow)"/>
        <rect x="395" y="65" width="72" height="375" rx="7" fill="url(#orange)" opacity=".9"/>
        <rect x="512" y="59" width="72" height="381" rx="7" fill="url(#orange)"/>
        <rect x="629" y="195" width="72" height="245" rx="7" fill="url(#orange)" opacity=".68"/>
      </g>
      <g text-anchor="middle" font-family="Arial, sans-serif">
        <g fill="#e8f4ff" font-size="16" font-weight="700">
          <text x="80" y="132">5.36</text><text x="197" y="128">5.43</text><text x="314" y="28">7.26</text>
          <text x="431" y="52">6.83</text><text x="548" y="46">6.93</text><text x="665" y="182">4.46</text>
        </g>
        <g fill="#a7bed3" font-size="13">
          <text x="80" y="470">FIFO</text><text x="197" y="470">RED</text><text x="314" y="470">FqCoDel</text>
          <text x="431" y="470">FIFO</text><text x="548" y="470">RED</text><text x="665" y="470">FqCoDel</text>
        </g>
        <text x="197" y="505" fill="#69b7ff" font-size="15" font-weight="700">TCP CUBIC</text>
        <text x="548" y="505" fill="#ff9b4c" font-size="15" font-weight="700">TCP BBR</text>
      </g>
    </g>
  </g>
</svg>
